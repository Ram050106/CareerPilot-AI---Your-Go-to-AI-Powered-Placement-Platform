<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Learning | CareerPilot AI</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family:
        Inter,
        Arial,
        sans-serif;

      background: #f5f7fb;
      color: #172033;
    }

    button {
      font-family: inherit;
    }

    /* HEADER */

    .learning-header {
      background: #ffffff;
      border-bottom: 1px solid #e6e9ef;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .learning-header-inner {
      max-width: 1400px;
      margin: auto;
      padding: 18px 28px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      font-size: 21px;
      font-weight: 800;
      color: #2563eb;
      text-decoration: none;
    }

    .back-course {
      text-decoration: none;
      color: #596579;
      font-size: 14px;
    }

    /* COURSE INFO */

    .course-info {
      background: #ffffff;
      border-bottom: 1px solid #e6e9ef;
    }

    .course-info-inner {
      max-width: 1400px;
      margin: auto;
      padding: 24px 28px;
    }

    .course-label {
      display: inline-block;

      color: #2563eb;
      font-size: 12px;
      font-weight: 700;

      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: .06em;
    }

    .course-info h1 {
      font-size: 28px;
      margin-bottom: 16px;
    }

    /* PROGRESS */

    .progress-area {
      max-width: 600px;
    }

    .progress-top {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;

      font-size: 13px;
      color: #667085;
    }

    .progress-bar {
      height: 9px;
      width: 100%;

      background: #e8edf5;
      border-radius: 99px;
      overflow: hidden;
    }

    .progress-fill {
      width: 0%;
      height: 100%;

      background: linear-gradient(
        90deg,
        #2563eb,
        #60a5fa
      );

      border-radius: 99px;

      transition:
        width .35s ease;
    }

    /* MAIN */

    .learning-layout {
      max-width: 1400px;
      margin: auto;

      padding: 28px;

      display: grid;
      grid-template-columns:
        minmax(0, 1fr)
        350px;

      gap: 28px;
    }

    /* VIDEO */

    .video-card {
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;

      border: 1px solid #e5e7eb;

      box-shadow:
        0 8px 30px
        rgba(15, 23, 42, .05);
    }

    .video-wrapper {
      background: #0b1220;
      aspect-ratio: 16 / 9;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .video-wrapper iframe,
    .video-wrapper video {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .no-video {
      color: #ffffff;
      text-align: center;
      padding: 30px;
    }

    .lesson-content {
      padding: 28px;
    }

    .lesson-number {
      font-size: 12px;
      color: #2563eb;
      font-weight: 700;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .lesson-content h2 {
      font-size: 25px;
      margin-bottom: 12px;
    }

    .lesson-description {
      color: #667085;
      line-height: 1.7;
      margin-bottom: 24px;
    }

    /* ACTIONS */

    .lesson-actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      border-top: 1px solid #edf0f5;
      padding-top: 22px;
    }

    .btn {
      border: 0;
      border-radius: 9px;

      padding: 12px 18px;

      cursor: pointer;

      font-size: 14px;
      font-weight: 700;

      transition: .2s ease;
    }

    .btn:hover {
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #eef2f7;
      color: #344054;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-success {
      background: #16a34a;
      color: white;
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    /* SIDEBAR */

    .lesson-sidebar {
      background: #ffffff;

      border: 1px solid #e5e7eb;
      border-radius: 16px;

      overflow: hidden;

      height: fit-content;

      position: sticky;
      top: 105px;
    }

    .sidebar-header {
      padding: 20px;

      border-bottom: 1px solid #e5e7eb;
    }

    .sidebar-header h3 {
      font-size: 18px;
      margin-bottom: 5px;
    }

    .sidebar-header p {
      color: #667085;
      font-size: 13px;
    }

    .lesson-list {
      max-height: 600px;
      overflow-y: auto;
    }

    .lesson-item {
      width: 100%;
      border: 0;
      background: transparent;

      padding: 15px 18px;

      display: flex;
      align-items: center;

      gap: 12px;

      text-align: left;

      cursor: pointer;

      border-bottom: 1px solid #f0f2f5;
    }

    .lesson-item:hover {
      background: #f8fafc;
    }

    .lesson-item.active {
      background: #eff6ff;
    }

    .lesson-item.completed {
      background: #f0fdf4;
    }

    .lesson-icon {
      width: 28px;
      height: 28px;

      flex-shrink: 0;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #eef2f7;

      font-size: 12px;
    }

    .lesson-item.active .lesson-icon {
      background: #2563eb;
      color: white;
    }

    .lesson-item.completed .lesson-icon {
      background: #16a34a;
      color: white;
    }

    .lesson-item-text {
      min-width: 0;
    }

    .lesson-item-title {
      font-size: 14px;
      font-weight: 600;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .lesson-item-meta {
      font-size: 11px;
      color: #8a94a6;
      margin-top: 3px;
    }

    /* LOADING */

    .loading-screen {
      min-height: 70vh;

      display: flex;
      align-items: center;
      justify-content: center;

      text-align: center;
    }

    .loading-screen h2 {
      margin-bottom: 8px;
    }

    .loading-screen p {
      color: #667085;
    }

    /* RESPONSIVE */

    @media (max-width: 900px) {

      .learning-layout {
        grid-template-columns: 1fr;
      }

      .lesson-sidebar {
        position: static;
      }

      .lesson-list {
        max-height: 400px;
      }

    }

    @media (max-width: 600px) {

      .learning-header-inner,
      .course-info-inner,
      .learning-layout {
        padding-left: 16px;
        padding-right: 16px;
      }

      .course-info h1 {
        font-size: 22px;
      }

      .lesson-content {
        padding: 20px;
      }

      .lesson-content h2 {
        font-size: 21px;
      }

      .lesson-actions {
        flex-direction: column;
      }

      .lesson-actions .btn {
        width: 100%;
      }

    }

  </style>

</head>


<body>

  <!-- HEADER -->

  <header class="learning-header">

    <div class="learning-header-inner">

      <a
        href="index.html"
        class="brand"
      >
        CareerPilot AI
      </a>

      <a
        href="courses.html"
        class="back-course"
      >
        ← Back to Courses
      </a>

    </div>

  </header>


  <!-- COURSE INFORMATION -->

  <section class="course-info">

    <div class="course-info-inner">

      <span
        class="course-label"
        id="courseLabel"
      >
        Paid Course
      </span>

      <h1 id="courseTitle">
        Loading course...
      </h1>


      <div class="progress-area">

        <div class="progress-top">

          <span>
            Your Progress
          </span>

          <strong id="progressText">
            0%
          </strong>

        </div>


        <div class="progress-bar">

          <div
            class="progress-fill"
            id="progressFill"
          ></div>

        </div>

      </div>

    </div>

  </section>


  <!-- MAIN -->

  <main
    class="learning-layout"
    id="learningLayout"
    style="display: none;"
  >


    <!-- VIDEO + LESSON -->

    <section>

      <div class="video-card">

        <div
          class="video-wrapper"
          id="videoContainer"
        >
        </div>


        <div class="lesson-content">

          <div
            class="lesson-number"
            id="lessonNumber"
          >
            Lesson 1
          </div>


          <h2 id="lessonTitle">
            Loading...
          </h2>


          <p
            class="lesson-description"
            id="lessonDescription"
          >
          </p>


          <div class="lesson-actions">

            <button
              class="btn btn-secondary"
              id="previousButton"
              type="button"
            >
              ← Previous
            </button>


            <button
              class="btn btn-primary"
              id="completeButton"
              type="button"
            >
              ✓ Mark as Complete
            </button>


            <button
              class="btn btn-secondary"
              id="nextButton"
              type="button"
            >
              Next →
            </button>

          </div>

        </div>

      </div>

    </section>


    <!-- LESSON SIDEBAR -->

    <aside class="lesson-sidebar">

      <div class="sidebar-header">

        <h3>
          Course Content
        </h3>

        <p id="lessonCount">
          Loading lessons...
        </p>

      </div>


      <div
        class="lesson-list"
        id="lessonList"
      >
      </div>

    </aside>


  </main>


  <!-- LOADING -->

  <div
    class="loading-screen"
    id="loadingScreen"
  >

    <div>

      <h2>
        Checking your course access...
      </h2>

      <p>
        Please wait a moment.
      </p>

    </div>

  </div>


  <script src="js/course-learning.js"></script>

</body>

</html>
